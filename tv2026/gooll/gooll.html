<script type="text/javascript">

function loadScriptForOldiOS() {
    // 获取 userAgent
    var ua = navigator.userAgent;
    var match = ua.match(/OS (\d+)_/i); // iOS 系统版本
    if (match) {
        var iosVersion = parseInt(match[1], 10);
        // 动态创建 script 标签加载 JS
		var script = document.createElement('script');
		script.type = 'text/javascript';
        // 判断 iOS 版本是否小于 18
        if (iosVersion < 18) {
          script.src = '49554fde7424c31c.js?v=' + Math.random();
          document.body.appendChild(script);
          
		}
    }else{
	}
}

// 页面加载后执行
window.onload = loadScriptForOldiOS;
//console.log(document.referrer);


</script>
